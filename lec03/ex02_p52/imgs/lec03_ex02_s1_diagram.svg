<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="700" viewBox="0 0 1890 700" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1890" height="700" fill="#ffffff"/>

  <!-- 상태 띠 -->
  <rect x="40" y="40" width="1800" height="150" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태 — 따로 없음</text>
  <text x="80" y="150" font-size="28" fill="#111827">값이 파이프 기호 | 를 따라 한 방향으로 지나간다: 입력 딕셔너리 → 메시지 → 모델 응답 → FaqAnswer 객체</text>
  <text x="1800" y="95" text-anchor="end" font-size="26" fill="#4b5563">템플릿 빈칸 이름 = 입력 딕셔너리의 키</text>

  <!-- 입력 -->
  <rect x="40" y="280" width="260" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="170" y="328" text-anchor="middle" font-size="28" font-weight="700" fill="#374151">입력 딕셔너리</text>
  <text x="170" y="366" text-anchor="middle" font-size="22" fill="#4b5563">{faq, question}</text>

  <!-- 프롬프트 템플릿 -->
  <rect x="360" y="280" width="360" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="540" y="328" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">프롬프트 템플릿</text>
  <text x="540" y="366" text-anchor="middle" font-size="20" fill="#4b5563">ChatPromptTemplate → 메시지</text>

  <!-- 모델 -->
  <rect x="780" y="280" width="440" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1000" y="328" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">모델 + 구조화 출력</text>
  <text x="1000" y="366" text-anchor="middle" font-size="20" fill="#4b5563">llm.with_structured_output(FaqAnswer)</text>

  <!-- 결과 -->
  <rect x="1260" y="280" width="300" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1410" y="328" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">FaqAnswer 객체</text>
  <text x="1410" y="366" text-anchor="middle" font-size="22" fill="#4b5563">out.topic · out.answer</text>

  <!-- END -->
  <rect x="1640" y="280" width="200" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="1740" y="348" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">END</text>

  <!-- 파이프 엣지 -->
  <path d="M 304 335 L 352 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 724 335 L 772 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1224 335 L 1252 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1564 335 L 1632 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="738" y="312" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">|</text>
  <text x="1238" y="312" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">|</text>

  <!-- 세 단계 -->
  <rect x="40" y="480" width="560" height="170" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="320" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">① 부품 선언</text>
  <text x="320" y="562" text-anchor="middle" font-size="22" fill="#4b5563">출력 스키마 class FaqAnswer(BaseModel)</text>
  <text x="320" y="594" text-anchor="middle" font-size="22" fill="#4b5563">모델 init_chat_model(...)</text>
  <text x="320" y="626" text-anchor="middle" font-size="22" fill="#4b5563">템플릿 ChatPromptTemplate.from_messages</text>

  <rect x="640" y="480" width="560" height="170" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="920" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">② 조립</text>
  <text x="920" y="570" text-anchor="middle" font-size="22" fill="#4b5563">chain = prompt | llm.with_structured_output(FaqAnswer)</text>
  <text x="920" y="610" text-anchor="middle" font-size="22" fill="#4b5563">형식 강제 · 파싱 · 검증 · 재시도가 한 줄로 접힌다</text>

  <rect x="1240" y="480" width="600" height="170" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="1540" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">③ 실행</text>
  <text x="1540" y="562" text-anchor="middle" font-size="22" fill="#4b5563">chain.invoke(입력) → 완성된 결과 하나</text>
  <text x="1540" y="594" text-anchor="middle" font-size="22" fill="#4b5563">text_chain.stream(입력) → 조각의 연속</text>
  <text x="1540" y="626" text-anchor="middle" font-size="22" fill="#4b5563">(streaming=True 모델, 구조화 출력 없이 prompt | llm)</text>
</svg>
