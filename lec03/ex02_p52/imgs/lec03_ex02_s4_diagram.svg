<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="700" viewBox="0 0 1890 700" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1890" height="700" fill="#ffffff"/>

  <!-- 상태 띠 -->
  <rect x="40" y="40" width="1800" height="150" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태 — 따로 없음 · 함수를 끼우는 위치가 둘</text>
  <text x="80" y="150" font-size="26" fill="#111827">템플릿 앞의 함수: 딕셔너리 → 딕셔너리 · 모델 뒤의 함수: 구조화 객체 → 문자열 · 앞 부품의 출력 모양 = 뒤 부품의 입력 모양</text>

  <!-- 입력 -->
  <rect x="40" y="280" width="180" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="130" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#374151">입력</text>
  <text x="130" y="364" text-anchor="middle" font-size="20" fill="#4b5563">잡음 섞인 질문</text>

  <!-- clean_input -->
  <rect x="270" y="280" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="400" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">다듬기 함수</text>
  <text x="400" y="364" text-anchor="middle" font-size="20" fill="#4b5563">clean_input: dict → dict</text>

  <!-- 템플릿 -->
  <rect x="580" y="280" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="710" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">프롬프트 템플릿</text>
  <text x="710" y="364" text-anchor="middle" font-size="20" fill="#4b5563">{faq} {question} → 메시지</text>

  <!-- 모델 -->
  <rect x="890" y="280" width="320" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1050" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">모델 + 구조화 출력</text>
  <text x="1050" y="364" text-anchor="middle" font-size="20" fill="#4b5563">→ FaqAnswer 객체</text>

  <!-- to_line -->
  <rect x="1260" y="280" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8"/>
  <text x="1390" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">화면 형식 함수</text>
  <text x="1390" y="364" text-anchor="middle" font-size="20" fill="#4b5563">to_line: 객체 → 문자열</text>

  <!-- 결과 -->
  <rect x="1570" y="280" width="270" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="1705" y="328" text-anchor="middle" font-size="24" font-weight="700" fill="#374151">결과</text>
  <text x="1705" y="364" text-anchor="middle" font-size="20" fill="#4b5563">"[주제] 답변"</text>

  <!-- 엣지 -->
  <path d="M 224 335 L 262 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 534 335 L 572 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 844 335 L 882 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1214 335 L 1252 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1524 335 L 1562 335" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="553" y="312" text-anchor="middle" font-size="24" font-weight="700" fill="#0055ff">|</text>
  <text x="863" y="312" text-anchor="middle" font-size="24" font-weight="700" fill="#0055ff">|</text>
  <text x="1233" y="312" text-anchor="middle" font-size="24" font-weight="700" fill="#0055ff">|</text>

  <!-- 세 단계 -->
  <rect x="40" y="480" width="620" height="170" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="350" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">① 부품 선언</text>
  <text x="350" y="562" text-anchor="middle" font-size="22" fill="#4b5563">스키마 FaqAnswer · 모델 · 템플릿 ((1)과 같음)</text>
  <text x="350" y="594" text-anchor="middle" font-size="22" fill="#4b5563">함수 clean_input(inputs: dict) -> dict</text>
  <text x="350" y="626" text-anchor="middle" font-size="22" fill="#4b5563">함수 to_line(out: FaqAnswer) -> str</text>

  <rect x="700" y="480" width="700" height="170" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="1050" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">② 조립</text>
  <text x="1050" y="560" text-anchor="middle" font-size="21" fill="#4b5563">RunnableLambda(clean_input) | prompt</text>
  <text x="1050" y="590" text-anchor="middle" font-size="21" fill="#4b5563">| llm.with_structured_output(FaqAnswer) | to_line</text>
  <text x="1050" y="626" text-anchor="middle" font-size="21" fill="#4b5563">파이프 첫 위치의 함수는 RunnableLambda로 감싼다</text>

  <rect x="1440" y="480" width="400" height="170" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="3"/>
  <text x="1640" y="524" text-anchor="middle" font-size="26" font-weight="700" fill="#374151">③ 실행</text>
  <text x="1640" y="570" text-anchor="middle" font-size="22" fill="#4b5563">chain.invoke({faq, question})</text>
  <text x="1640" y="610" text-anchor="middle" font-size="22" fill="#4b5563">→ "[주차] …" (질문 두 건)</text>
</svg>
