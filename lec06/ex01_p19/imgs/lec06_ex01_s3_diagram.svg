<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="800" viewBox="0 0 1890 800" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1890" height="800" fill="#ffffff"/>

  <!-- 상태 띠 -->
  <rect x="40" y="40" width="1810" height="150" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태(State) — MailState</text>
  <text x="80" y="150" font-size="28" fill="#111827">memo 교육 메모 · agenda 일정 안내 · prep 준비 자료 · greet 인사말 · body 이어 붙인 본문 · mail 완성 메일</text>
  <text x="1810" y="95" text-anchor="end" font-size="26" fill="#4b5563">모든 노드가 함께 읽고 쓴다</text>

  <!-- 상태 ↔ 노드 점선 -->
  <path d="M 690 190 L 690 236" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1130 190 L 1130 376" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1470 190 L 1470 376" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>

  <!-- START -->
  <rect x="40" y="380" width="200" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="140" y="448" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">START</text>

  <!-- agenda -->
  <rect x="560" y="240" width="260" height="100" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="690" y="283" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">agenda</text>
  <text x="690" y="320" text-anchor="middle" font-size="26" fill="#4b5563">일정 안내</text>

  <!-- prep -->
  <rect x="560" y="385" width="260" height="100" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="690" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">prep</text>
  <text x="690" y="465" text-anchor="middle" font-size="26" fill="#4b5563">준비 자료 목록</text>

  <!-- greet -->
  <rect x="560" y="530" width="260" height="100" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="690" y="573" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">greet</text>
  <text x="690" y="610" text-anchor="middle" font-size="26" fill="#4b5563">첫머리 인사말</text>

  <!-- aggregator -->
  <rect x="990" y="380" width="280" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1130" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">aggregator</text>
  <text x="1130" y="468" text-anchor="middle" font-size="26" fill="#4b5563">본문 결합 · 모델 없음</text>

  <!-- polish -->
  <rect x="1340" y="380" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1470" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">polish</text>
  <text x="1470" y="468" text-anchor="middle" font-size="26" fill="#4b5563">존댓말 메일로 다듬기</text>

  <!-- END -->
  <rect x="1670" y="380" width="180" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="1760" y="448" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">END</text>

  <!-- 팬아웃: START -> 세 노드 -->
  <path d="M 244 425 C 400 425 400 290 552 290" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 244 435 L 552 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 244 445 C 400 445 400 580 552 580" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="400" y="665" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">셋으로 나뉜다(동시에 시작)</text>

  <!-- 팬인: 세 노드 -> aggregator -->
  <path d="M 824 290 C 905 290 905 425 982 425" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 824 435 L 982 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 824 580 C 905 580 905 445 982 445" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="905" y="665" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">한 곳으로 모인다</text>

  <!-- 직렬: aggregator -> polish -> END -->
  <path d="M 1274 435 L 1332 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1604 435 L 1662 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="1420" y="665" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">모인 뒤에 직렬로 한 단계 더</text>

  <!-- 하단 설명 -->
  <text x="945" y="730" text-anchor="middle" font-size="28" fill="#111827">polish는 aggregator가 채운 body를 읽으므로 병렬 구간에 넣지 못하고 그 뒤에 직렬로 둔다</text>
</svg>
