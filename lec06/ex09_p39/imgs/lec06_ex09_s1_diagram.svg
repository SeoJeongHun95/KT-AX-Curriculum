<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="800" viewBox="0 0 1890 800" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
    <marker id="ahb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0055ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1890" height="800" fill="#ffffff"/>

  <!-- 상태 띠 -->
  <rect x="40" y="40" width="1810" height="150" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태(State) — HandoffState</text>
  <text x="80" y="150" font-size="28" fill="#111827">messages 대화 이력(add_messages 리듀서) · active_agent 현재 에이전트(접수 / 배송) — 이 칸의 값이 agent의 지침과 도구를 바꾼다</text>
  <text x="1810" y="95" text-anchor="end" font-size="26" fill="#4b5563">모든 노드가 함께 읽고 쓴다</text>

  <!-- 상태 ↔ 노드 점선 -->
  <path d="M 520 190 L 520 376" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1250 190 L 1250 236" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>

  <!-- START -->
  <rect x="40" y="380" width="200" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="140" y="448" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">START</text>

  <!-- agent -->
  <rect x="450" y="380" width="360" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="630" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">agent</text>
  <text x="630" y="468" text-anchor="middle" font-size="24" fill="#4b5563">현재 에이전트의 지침·도구로 응대</text>

  <!-- tools -->
  <rect x="950" y="240" width="360" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1130" y="288" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">tools</text>
  <text x="1130" y="328" text-anchor="middle" font-size="24" fill="#4b5563">to_delivery 실행 → 에이전트 교체</text>

  <!-- END -->
  <rect x="1620" y="520" width="200" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="1720" y="588" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">END</text>

  <!-- START -> agent -->
  <path d="M 244 435 L 442 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- agent -> tools (조건부, 도구 호출 있음) -->
  <path d="M 814 410 C 880 410 880 295 942 295" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/>
  <text x="915" y="392" text-anchor="middle" font-size="24" font-weight="700" fill="#0055ff">도구 호출 있음</text>

  <!-- tools -> agent (고정, 위로 돌아 되돌아옴) -->
  <path d="M 1130 236 L 1130 215 L 630 215 L 630 372" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="740" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#374151">도구가 끝나면 agent로 돌아온다(에이전트가 바뀐 채)</text>

  <!-- agent -> END (조건부, 도구 호출 없음) -->
  <path d="M 814 460 C 1200 460 1200 575 1612 575" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/>
  <text x="1300" y="505" text-anchor="middle" font-size="24" font-weight="700" fill="#0055ff">도구 호출 없음</text>

  <!-- 에이전트 표 -->
  <rect x="40" y="540" width="620" height="150" rx="12" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <text x="60" y="580" font-size="26" font-weight="700" fill="#374151">에이전트에 따라 바뀌는 것</text>
  <text x="60" y="625" font-size="24" fill="#111827">접수: 주문 번호·품목만 다룸 · 도구 to_delivery</text>
  <text x="60" y="665" font-size="24" fill="#111827">배송: 배송 상태를 두 문장으로 안내 · 도구 없음</text>

  <!-- 하단 설명 -->
  <text x="945" y="750" text-anchor="middle" font-size="28" fill="#111827">노드는 agent와 tools 둘뿐이다. 에이전트가 바뀌어도 그래프 모양은 그대로이고, 바뀌는 것은 상태의 active_agent 값이다</text>
</svg>
