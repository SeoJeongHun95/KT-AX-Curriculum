<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="760" viewBox="0 0 1890 760" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1890" height="760" fill="#ffffff"/>

  <!-- LangSmith 서버 띠 -->
  <rect x="40" y="40" width="1810" height="130" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="92" font-size="30" font-weight="700" fill="#0055ff">LangSmith 서버 — 프로젝트 sesac-lec05-ex03 (도서관, 비용 우선 운영)</text>
  <text x="80" y="142" font-size="26" fill="#111827">성공 런 · 실패 런 · 답한 모델 이름 · 토큰 · 비용</text>

  <!-- 운영 장치 6단 (회색 = 이 문제에서 쓰지 않는 단) -->
  <rect x="40" y="250" width="280" height="130" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="180" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">① 대체(fallback)</text>
  <text x="180" y="343" text-anchor="middle" font-size="22" fill="#4b5563">경량 → 기본 → 고성능</text>
  <path d="M 180 384 L 180 512" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="180" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#0055ff">호출 인자</text>
  <rect x="345" y="250" width="280" height="130" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="485" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">② 실패 런 기록</text>
  <text x="485" y="343" text-anchor="middle" font-size="22" fill="#4b5563">예외 받기 · flush</text>
  <path d="M 485 384 L 485 512" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="485" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#0055ff">예외</text>
  <rect x="650" y="250" width="280" height="130" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="790" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">③ 비용 측정</text>
  <text x="790" y="343" text-anchor="middle" font-size="22" fill="#4b5563">completion_cost · usage</text>
  <path d="M 790 384 L 790 512" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="790" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#0055ff">응답</text>
  <rect x="955" y="250" width="280" height="130" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1095" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">④ 프롬프트 캐싱</text>
  <text x="1095" y="343" text-anchor="middle" font-size="22" fill="#4b5563">규정집 접두 2회</text>
  <path d="M 1095 384 L 1095 512" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="1095" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#0055ff">응답 usage</text>
  <rect x="1260" y="250" width="280" height="130" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1400" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">⑤ 토큰 예산</text>
  <text x="1400" y="343" text-anchor="middle" font-size="22" fill="#4b5563">하루 0.0005달러</text>
  <path d="M 1400 384 L 1400 512" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="1400" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#0055ff">감싸기</text>
  <rect x="1565" y="250" width="285" height="130" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1707" y="300" text-anchor="middle" font-size="28" font-weight="700" fill="#111827">⑥ 티어링</text>
  <text x="1707" y="343" text-anchor="middle" font-size="22" fill="#4b5563">민원성 낱말 → 고성능</text>
  <path d="M 1707 384 L 1707 512" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="1707" y="455" text-anchor="middle" font-size="22" font-weight="700" fill="#0055ff">모델 이름</text>

  <!-- 호출 단계 -->
  <rect x="40" y="520" width="1810" height="110" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="945" y="565" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">호출 단계 litellm.completion (관측 계측 붙음) · 도서관 서비스 make_messages는 고치지 않는다</text>
  <text x="945" y="608" text-anchor="middle" font-size="24" fill="#4b5563">평소 경량 gpt-4o-mini · 대체 기본 gpt-5.6-luna · 민원성 질문 고성능 gpt-5.6-terra</text>

  <!-- 호출 단계 → 서버 점선 -->
  <path d="M 945 516 L 945 178" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <text x="1000" y="215" font-size="22" fill="#0055ff">런 전송</text>

  <!-- 하단 안내 -->
  <text x="945" y="735" text-anchor="middle" font-size="24" fill="#4b5563">같은 여섯 장치라도 비용 우선 운영에서는 순서·값·규칙이 달라진다</text>
</svg>
