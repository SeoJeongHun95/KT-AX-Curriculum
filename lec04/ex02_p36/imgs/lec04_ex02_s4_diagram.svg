<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="900" viewBox="0 0 1890 900" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
    <marker id="ahb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0055ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1890" height="900" fill="#ffffff"/>
  <rect x="40" y="40" width="1810" height="150" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태(State) — PolicyState</text>
  <text x="80" y="150" font-size="27" fill="#111827">messages 대화 기록 · amount 변경 금액 · policy 방침 · draft 답장 초안 · sent 발송 여부</text>
  <text x="1810" y="95" text-anchor="end" font-size="26" fill="#4b5563">모든 노드가 함께 읽고 쓴다</text>
  <path d="M 460 190 L 460 375" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1220 190 L 1220 375" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1540 190 L 1540 375" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 840 190 L 840 225" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <rect x="40" y="380" width="220" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="150" y="448" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">START</text>
  <rect x="340" y="380" width="240" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="460" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">manage</text>
  <text x="460" y="468" text-anchor="middle" font-size="24" fill="#4b5563">오래된 대화 요약</text>
  <rect x="700" y="230" width="280" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="840" y="270" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">ask_policy</text>
  <text x="840" y="300" text-anchor="middle" font-size="24" fill="#4b5563">담당자 방침 받기</text>
  <text x="840" y="328" text-anchor="middle" font-size="22" font-weight="700" fill="#b45309">interrupt() 멈춤</text>
  <rect x="700" y="540" width="280" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="840" y="588" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">auto_policy</text>
  <text x="840" y="628" text-anchor="middle" font-size="24" fill="#4b5563">기본 방침 채우기</text>
  <rect x="1100" y="380" width="240" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1220" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">draft</text>
  <text x="1220" y="468" text-anchor="middle" font-size="24" fill="#4b5563">방침대로 초안 작성</text>
  <rect x="1420" y="380" width="240" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1540" y="428" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">send</text>
  <text x="1540" y="468" text-anchor="middle" font-size="24" fill="#4b5563">답장 발송</text>
  <rect x="1720" y="380" width="160" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="1800" y="448" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">END</text>
  <path d="M 264 435 L 332 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 584 435 L 640 435 L 640 285 L 692 285" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/>
  <path d="M 584 435 L 640 435 L 640 595 L 692 595" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/>
  <text x="560" y="255" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">금액 ≥ 기준</text>
  <text x="560" y="660" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">금액 &lt; 기준</text>
  <path d="M 984 285 L 1040 285 L 1040 435 L 1092 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 984 595 L 1040 595 L 1040 435 L 1092 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1344 435 L 1412 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1664 435 L 1712 435" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <circle cx="610" cy="435" r="11" fill="#059669"/>
  <circle cx="1380" cy="435" r="11" fill="#059669"/>
  <path d="M 1380 446 L 1380 700" stroke="#059669" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <circle cx="1690" cy="435" r="11" fill="#059669"/>
  <path d="M 1690 446 L 1690 700" stroke="#059669" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <rect x="40" y="700" width="1810" height="150" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="80" y="755" font-size="30" font-weight="700" fill="#047857">체크포인터(SqliteSaver) — 어느 분기를 지나든 노드가 끝나는 경계(●)마다 저장한다</text>
  <text x="80" y="810" font-size="27" fill="#111827">고액 건만 담당자 앞에서 멈추고, 소액 건은 멈추지 않고 발송까지 간다 · 같은 thread_id로 대화 기록이 이어진다</text>
</svg>
