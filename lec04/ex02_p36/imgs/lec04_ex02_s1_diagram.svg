<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="780" viewBox="0 0 1890 780" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1890" height="780" fill="#ffffff"/>

  <!-- 상태 띠 -->
  <rect x="40" y="40" width="1810" height="150" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태(State) — ReplyState</text>
  <text x="80" y="150" font-size="28" fill="#111827">messages 대화 기록(add_messages 리듀서) · draft 답장 초안 · decision 담당자 결정 · sent 발송 여부</text>
  <text x="1810" y="95" text-anchor="end" font-size="26" fill="#4b5563">모든 노드가 함께 읽고 쓴다</text>

  <!-- 상태 ↔ 노드 점선 -->
  <path d="M 460 190 L 460 285" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 780 190 L 780 285" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1140 190 L 1140 285" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1500 190 L 1500 285" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>

  <!-- START -->
  <rect x="40" y="290" width="220" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="150" y="358" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">START</text>

  <!-- manage -->
  <rect x="340" y="290" width="240" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="460" y="338" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">manage</text>
  <text x="460" y="378" text-anchor="middle" font-size="26" fill="#4b5563">오래된 대화 요약</text>

  <!-- draft -->
  <rect x="660" y="290" width="240" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="780" y="338" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">draft</text>
  <text x="780" y="378" text-anchor="middle" font-size="26" fill="#4b5563">답장 초안 작성</text>

  <!-- human_review -->
  <rect x="980" y="290" width="320" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1140" y="338" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">human_review</text>
  <text x="1140" y="378" text-anchor="middle" font-size="26" fill="#4b5563">담당자 승인·수정</text>

  <!-- send -->
  <rect x="1380" y="290" width="240" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1500" y="338" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">send</text>
  <text x="1500" y="378" text-anchor="middle" font-size="26" fill="#4b5563">답장 발송</text>

  <!-- END -->
  <rect x="1660" y="290" width="220" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="1770" y="358" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">END</text>

  <!-- 고정 엣지 -->
  <path d="M 264 345 L 332 345" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 584 345 L 652 345" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 904 345 L 972 345" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1304 345 L 1372 345" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1624 345 L 1652 345" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- interrupt 멈춤 표지 -->
  <path d="M 1140 404 L 1140 450" stroke="#b45309" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <rect x="860" y="450" width="560" height="90" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="3"/>
  <text x="1140" y="488" text-anchor="middle" font-size="26" font-weight="700" fill="#b45309">interrupt() — 발송 앞에서 멈춘다</text>
  <text x="1140" y="522" text-anchor="middle" font-size="24" fill="#7c2d12">담당자의 답 Command(resume=…)으로 이어 간다</text>

  <!-- 저장 지점 표지: 노드가 끝나는 경계마다 -->
  <circle cx="620" cy="345" r="11" fill="#059669"/>
  <circle cx="940" cy="345" r="11" fill="#059669"/>
  <circle cx="1340" cy="345" r="11" fill="#059669"/>
  <circle cx="1640" cy="345" r="11" fill="#059669"/>
  <path d="M 620 356 L 620 590" stroke="#059669" stroke-width="3" stroke-dasharray="8 6" fill="none"/>
  <path d="M 1640 356 L 1640 590" stroke="#059669" stroke-width="3" stroke-dasharray="8 6" fill="none"/>

  <!-- 체크포인터 띠 -->
  <rect x="40" y="590" width="1810" height="150" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
  <text x="80" y="645" font-size="30" font-weight="700" fill="#047857">체크포인터(SqliteSaver) — 노드가 끝나는 경계(●)마다 상태 전체를 thread_id 아래 파일에 저장한다</text>
  <text x="80" y="700" font-size="28" fill="#111827">같은 thread_id로 다시 부르면 마지막 저장 지점부터 이어 간다 · 입력 None = 이어서 · get_state = 실행 없이 저장된 상태 읽기</text>
</svg>
