<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="740" viewBox="0 0 1890 740" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/>
    </marker>
    <marker id="ahb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#0055ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1890" height="740" fill="#ffffff"/>

  <!-- 상태 띠 -->
  <rect x="40" y="40" width="1800" height="150" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/>
  <text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태(State) — TicketState</text>
  <text x="80" y="150" font-size="28" fill="#111827">ticket 요청 본문 · level 긴급도 · reply 나갈 글 · logged 기록 여부</text>
  <text x="1800" y="95" text-anchor="end" font-size="26" fill="#4b5563">모든 노드가 함께 읽고 쓴다</text>

  <!-- 상태 ↔ 노드 점선 -->
  <path d="M 530 190 L 530 357" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 990 190 L 990 242" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
  <path d="M 1350 190 L 1350 357" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/>

  <!-- START -->
  <rect x="40" y="365" width="220" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="150" y="433" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">START</text>

  <!-- triage -->
  <rect x="400" y="365" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="530" y="413" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">triage</text>
  <text x="530" y="453" text-anchor="middle" font-size="26" fill="#4b5563">긴급도 판정</text>

  <!-- escalate (위) -->
  <rect x="860" y="250" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="990" y="298" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">escalate</text>
  <text x="990" y="338" text-anchor="middle" font-size="26" fill="#4b5563">엔지니어 호출문</text>

  <!-- answer (아래) -->
  <rect x="860" y="490" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="990" y="538" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">answer</text>
  <text x="990" y="578" text-anchor="middle" font-size="26" fill="#4b5563">자가 해결 안내문</text>

  <!-- record -->
  <rect x="1220" y="365" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/>
  <text x="1350" y="413" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">record</text>
  <text x="1350" y="453" text-anchor="middle" font-size="26" fill="#4b5563">접수 대장 기록</text>

  <!-- END -->
  <rect x="1620" y="365" width="220" height="110" rx="55" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/>
  <text x="1730" y="433" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">END</text>

  <!-- 고정 엣지 START -> triage -->
  <path d="M 264 420 L 392 420" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- 조건부 엣지 triage -> escalate / answer -->
  <path d="M 664 400 L 750 400 L 750 305 L 852 305" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/>
  <path d="M 664 440 L 750 440 L 750 545 L 852 545" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/>
  <text x="800" y="278" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">긴급</text>
  <text x="800" y="590" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">일반</text>

  <!-- 고정 엣지 escalate/answer -> record -->
  <path d="M 1124 305 L 1290 305 L 1290 357" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M 1124 545 L 1290 545 L 1290 483" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- 고정 엣지 record -> END -->
  <path d="M 1484 420 L 1612 420" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- 조건부 엣지 설명 -->
  <text x="945" y="680" text-anchor="middle" font-size="28" font-weight="700" fill="#0055ff">조건부 엣지 route — 긴급도가 긴급이면 escalate로, 일반이면 answer로 보낸다</text>
</svg>
