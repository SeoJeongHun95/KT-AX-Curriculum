<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="660" viewBox="0 0 1890 660" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#374151"/></marker><marker id="ahb" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#0055ff"/></marker><marker id="aho" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 12 6 L 0 12 z" fill="#b45309"/></marker></defs><rect x="0" y="0" width="1890" height="660" fill="#ffffff"/><rect x="40" y="40" width="1810" height="130" rx="16" fill="#eef4ff" stroke="#0055ff" stroke-width="3"/><text x="80" y="95" font-size="30" font-weight="700" fill="#0055ff">상태(State) — ImageState</text><text x="80" y="150" font-size="28" fill="#111827">topic · prompt · images(add) · error 생성 오류 종류(없음 / 일시 / 차단) · attempts 생성 시도 횟수 · verdict 판정</text><text x="1810" y="95" text-anchor="end" font-size="26" fill="#4b5563">모든 노드가 함께 읽고 쓴다</text><path d="M 560 170 L 560 325" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/><path d="M 1330 170 L 1330 325" stroke="#0055ff" stroke-width="3" stroke-dasharray="10 8" fill="none"/><rect x="50" y="330" width="200" height="100" rx="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="150" y="391" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">START</text><rect x="430" y="325" width="260" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/><text x="560" y="373" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">design</text><text x="560" y="413" text-anchor="middle" font-size="25" fill="#4b5563">지시문 설계</text><rect x="735" y="325" width="420" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/><text x="945" y="373" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">generate</text><text x="945" y="413" text-anchor="middle" font-size="25" fill="#4b5563">이미지 생성 (오류를 상태에 쓴다)</text><rect x="1210" y="325" width="240" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/><text x="1330" y="373" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">review</text><text x="1330" y="413" text-anchor="middle" font-size="25" fill="#4b5563">사람 판정</text><rect x="1640" y="330" width="200" height="100" rx="50" fill="#f3f4f6" stroke="#6b7280" stroke-width="3"/><text x="1740" y="391" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">END</text><path d="M 254 380 L 426 380" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/><path d="M 694 380 L 731 380" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/><path d="M 1159 380 L 1206 380" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/><text x="1182" y="358" text-anchor="middle" font-size="22" font-weight="700" fill="#0055ff">정상</text><path d="M 1454 380 L 1636 380" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/><text x="1545" y="358" text-anchor="middle" font-size="26" font-weight="700" fill="#0055ff">확정</text><rect x="735" y="175" width="420" height="110" rx="12" fill="#ffffff" stroke="#0055ff" stroke-width="4"/><text x="945" y="223" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">notify</text><text x="945" y="263" text-anchor="middle" font-size="25" fill="#4b5563">사용자에게 안내 (다시 부르지 않는다)</text><path d="M 945 325 L 945 289" stroke="#0055ff" stroke-width="4" stroke-dasharray="14 8" fill="none" marker-end="url(#ahb)"/><text x="962" y="312" text-anchor="start" font-size="24" font-weight="700" fill="#0055ff">차단</text><path d="M 1159 230 L 1740 230 L 1740 326" stroke="#374151" stroke-width="4" fill="none" marker-end="url(#ah)"/><path d="M 1040 435 L 1040 500 L 850 500